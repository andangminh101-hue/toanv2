<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luyện thi Toán 2026 - Đặng Minh An</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1d2330;--muted:#6b7280;--accent:#3b5bdb;--ok:#2f9e44;--bad:#e03131;--line:#e5e7eb;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--card:#1f2229;--text:#e8eaf0;--muted:#9aa1ad;--accent:#748ffc;--ok:#51cf66;--bad:#ff6b6b;--line:#2e333d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171c;--card:#1f2229;--text:#e8eaf0;--muted:#9aa1ad;--accent:#748ffc;--ok:#51cf66;--bad:#ff6b6b;--line:#2e333d;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top,0px) 14px env(safe-area-inset-bottom,0px);}
.wrap{max-width:680px;margin:0 auto;padding:16px 0 40px}
h1{font-size:20px;margin:8px 0 4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:14px}
.rainbow{background:linear-gradient(90deg,#e03131,#f76707,#f59f00,#2f9e44,#1c7ed6,#3b5bdb,#7048e8,#d6336c,#e03131);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700;display:inline-block;animation:rb 4s linear infinite,spin3d 6s ease-in-out infinite;filter:drop-shadow(0 3px 0 rgba(0,0,0,.25))}
@keyframes spin3d{0%,100%{transform:perspective(500px) rotateX(10deg) rotateY(-28deg)}50%{transform:perspective(500px) rotateX(-10deg) rotateY(28deg)}}
@keyframes rb{from{background-position:0% 50%}to{background-position:100% 50%}}
.pbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:8px}
.pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
@media (prefers-reduced-motion:reduce){.rainbow{animation:none}}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 12px;border-radius:999px;font-size:14px;cursor:pointer}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:12px}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:8px}
.q{font-size:16px;line-height:1.55;margin:0 0 14px}
.q .math{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--bg);padding:1px 5px;border-radius:5px}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);color:var(--text);padding:12px 14px;border-radius:10px;margin-bottom:8px;font-size:15px;cursor:pointer}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:rgba(47,158,68,.12)}
.opt.wrong{border-color:var(--bad);background:rgba(224,49,49,.12)}
.expl{margin-top:10px;padding:12px;border-radius:10px;background:var(--bg);font-size:14px;line-height:1.55;display:none}
.expl.show{display:block}
.row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;border:none;background:var(--accent);color:#fff;padding:11px;border-radius:10px;font-size:15px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.score{text-align:center;padding:20px}
.score .big{font-size:40px;font-weight:700;color:var(--accent)}
.figwrap{text-align:center;margin:4px 0 14px}
.fig{width:100%;max-width:360px;height:auto;display:inline-block;background:var(--bg);border-radius:10px}
.fig .gr{stroke:var(--line);stroke-width:1}
.fig .ax{stroke:var(--muted);stroke-width:1.4}
.fig .lb{font-size:12px;fill:var(--text);font-family:system-ui,sans-serif}
.fig .tk{font-size:12.5px;font-weight:600;fill:var(--text);font-family:system-ui,sans-serif;paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
.fig .pl{font-size:13px;font-weight:700;fill:var(--text);font-family:system-ui,sans-serif;paint-order:stroke;stroke:var(--card);stroke-width:4px;stroke-linejoin:round}
.fig .gr{stroke-opacity:.7}
.rep{text-align:left;margin-top:14px}
.rep h3{font-size:16px;margin:16px 0 8px}
.trow{display:flex;align-items:center;gap:8px;font-size:14px;margin:6px 0}
.trow span:first-child{flex:0 0 110px}
.trow .bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.trow .bar i{display:block;height:100%;background:var(--accent)}
.wr{font-size:14px;line-height:1.5;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px}
/* ===== Giao diện mới ===== */
html,body{background:linear-gradient(160deg,#eef2ff 0%,#f8f9ff 45%,#fdf2f8 100%) fixed;min-height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) html,:root:not([data-theme="light"]) body{background:linear-gradient(160deg,#15171c,#1b1e27 60%,#221a26)}}
.wrap{max-width:720px;padding:22px 16px 48px}
h1{font-size:28px;font-weight:800;letter-spacing:-.3px;margin:6px 0 2px;text-align:center}
.sub{text-align:center;font-size:14px;margin-bottom:18px;color:var(--muted)}
.tabs{gap:8px;padding:4px 2px 10px;justify-content:center;flex-wrap:wrap}
.tab{border:1px solid transparent;background:var(--card);box-shadow:0 2px 6px rgba(20,30,60,.06);font-weight:500;transition:transform .15s,box-shadow .15s,background .2s}
.tab:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(20,30,60,.12)}
.tab.active{box-shadow:0 6px 16px rgba(59,91,219,.35)}
.card{border-radius:20px;padding:22px;box-shadow:0 10px 30px rgba(20,30,60,.08);border:1px solid rgba(120,130,160,.15);animation:pop .35s ease}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.meta{font-size:13px;font-weight:600;letter-spacing:.2px;margin-bottom:12px}
.meta span:first-child{background:var(--bg);padding:4px 10px;border-radius:999px;color:var(--accent)}
.meta span:last-child{background:var(--bg);padding:4px 10px;border-radius:999px}
.q{font-size:17px;line-height:1.65;margin:0 0 16px}
.q .math{background:linear-gradient(135deg,rgba(59,91,219,.10),rgba(112,72,232,.10));color:var(--text);padding:2px 7px;border-radius:7px}
.opt{border-radius:14px;padding:13px 16px;margin-bottom:10px;font-size:15px;transition:transform .15s,border-color .15s,background .15s,box-shadow .15s;box-shadow:0 1px 2px rgba(20,30,60,.04)}
.opt:not(:disabled):hover{transform:translateX(4px);border-color:var(--accent);background:rgba(59,91,219,.06);box-shadow:0 4px 12px rgba(59,91,219,.12)}
.opt.correct{box-shadow:0 4px 14px rgba(47,158,68,.25)}
.opt.wrong{box-shadow:0 4px 14px rgba(224,49,49,.2)}
.expl{border-left:4px solid var(--accent);border-radius:12px;padding:14px 16px;background:linear-gradient(135deg,rgba(59,91,219,.06),rgba(112,72,232,.05))}
.btn{border-radius:14px;padding:13px;font-weight:600;letter-spacing:.2px;box-shadow:0 6px 16px rgba(59,91,219,.28);transition:transform .15s,box-shadow .15s}
.btn:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(59,91,219,.36)}
.btn.ghost{box-shadow:none;background:var(--card)}
.row{gap:10px;margin-top:14px}
.pbar{height:10px;border-radius:999px;background:rgba(120,130,160,.18);margin-top:12px}
.pbar i{background:linear-gradient(90deg,#3b5bdb,#7048e8,#d6336c);border-radius:999px}
.score{padding:14px 8px}
.score > div:first-child{font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:1.5px;font-weight:600}
.score .big{font-size:56px;font-weight:800;background:linear-gradient(90deg,#3b5bdb,#7048e8,#d6336c);-webkit-background-clip:text;background-clip:text;color:transparent;margin:6px 0}
.score .sub{font-size:15px}
.rep h3{font-size:17px;font-weight:700;margin:20px 0 10px}
.trow{font-size:14px;gap:10px}
.trow .bar{height:10px;border-radius:999px}
.trow .bar i{border-radius:999px;background:linear-gradient(90deg,#3b5bdb,#7048e8)}
.wr{border-radius:14px;padding:14px;border-left:4px solid var(--bad);background:var(--card);box-shadow:0 2px 8px rgba(20,30,60,.05)}
.figwrap{margin:6px 0 16px}
.fig{border-radius:14px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line);max-width:380px}
.namebox{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid rgba(120,130,160,.15);border-radius:16px;padding:10px 14px;margin:0 0 12px;box-shadow:0 6px 18px rgba(20,30,60,.06)}
.namebox label{font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap}
.namebox input{flex:1;min-width:0;border:none;background:transparent;color:var(--text);font-size:16px;font-weight:600;outline:none;padding:6px 2px}
.namebox input::placeholder{color:var(--muted);font-weight:400}
[hidden]{display:none !important}
.fig .ax{stroke:var(--text);stroke-width:1.8}
.fig .ds{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:6 5}
.fig .cv{fill:none;stroke:var(--text);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.fig .cv.c2{stroke:#e8590c}
.fig .tk{font-size:14px;font-weight:500;fill:var(--text);font-family:Georgia,"Times New Roman",serif;paint-order:stroke;stroke:var(--card);stroke-width:3px}
.fig .pl{font-size:15px;font-weight:700;fill:var(--text);font-family:Georgia,"Times New Roman",serif;paint-order:stroke;stroke:var(--card);stroke-width:4px}
</style>
</head>
<body>
<div class="wrap">
  <h1 id="title"><span class="rainbow">Đặng Minh An</span></h1>
  <div class="sub" id="subLine">Trắc Nghiệm Có Hình vẽ Tự Động chấm Điểm <div class="pbar"><i id="pfill"></i></div></div>

<div class="namebox" id="gate"><label for="pname">Học sinh tham gia</label><input id="pname" placeholder="Nhập họ và tên" maxlength="40" autocomplete="off"></div>
  <button class="btn" id="startBtn" style="width:100%;margin:4px 0 12px">Bắt đầu làm bài →</button>
  <button class="btn ghost" id="backBtn" hidden style="width:100%;margin:0 0 12px">← Về trang nhập tên</button>
  <div class="tabs" id="tabs"></div>

  <div class="sub" id="lenRow" hidden style="margin:0 0 10px">Số câu mỗi lượt: <select id="lenSel" style="font-size:15px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text)"><option>10</option><option>20</option><option selected>30</option><option>50</option><option>100</option><option value="0">Tất cả</option></select></div>

  <div class="card" id="app"></div>


<script>
const TOPICS = [
  {name:"Tất cả", key:"all"},
  {name:"Đạo hàm", key:"dh"},
  {name:"Đơn điệu", key:"dd"},
  {name:"Cực trị", key:"ct"},
  {name:"Cực đại-cực tiểu", key:"cd"},
  {name:"GTLN-GTNN", key:"gt"},
  {name:"Đồ thị", key:"dt"},
  {name:"Giao điểm", key:"gd"},
  {name:"Vectơ", key:"vt"},
  {name:"Bài thực tế", key:"tt"}
];

const QUESTIONS = [
  {topic:"dh", q:"Cho hàm số <span class='math'>f(x) = x³ − 3x + 1</span>. Tính <span class='math'>f'(x)</span>.", opts:["3x² + 3","3x² − 3","x² − 3","3x − 3"], ans:1, exp:"Áp dụng (xⁿ)' = n·xⁿ⁻¹: (x³)' = 3x², (−3x)' = −3, (1)' = 0. Vậy f'(x) = 3x² − 3."},
  {topic:"dh", q:"Cho <span class='math'>f(x) = (2x + 1)/(x − 1)</span>. Tính <span class='math'>f'(x)</span>.", opts:["3/(x − 1)²","−1/(x − 1)²","−3/(x − 1)²","1/(x − 1)²"], ans:2, exp:"Dùng (u/v)' = (u'v − uv')/v² với u = 2x+1, v = x−1: tử = 2(x−1) − (2x+1) = −3, mẫu = (x−1)². Vậy f'(x) = −3/(x−1)²."},
  {topic:"dd", q:"Cho <span class='math'>f(x) = x³ − 3x²</span>. Hàm số đồng biến trên khoảng nào?", opts:["(0; 2)","(−∞; 0) và (2; +∞)","(−∞; 2)","(0; +∞)"], ans:1, exp:"f'(x) = 3x² − 6x = 3x(x − 2). f'(x) > 0 khi x < 0 hoặc x > 2, nên hàm đồng biến trên (−∞; 0) và (2; +∞)."},
  {topic:"ct", q:"Cho <span class='math'>f(x) = x³ − 3x²</span>. Giá trị cực tiểu của hàm số là?", opts:["0","4","−2","−4"], ans:3, exp:"f'(x) = 0 tại x = 0 và x = 2. Đạo hàm đổi dấu từ + sang − tại x = 0 (cực đại) và từ − sang + tại x = 2 (cực tiểu). Giá trị cực tiểu: f(2) = 8 − 12 = −4."},
  {topic:"gt", q:"Tìm giá trị nhỏ nhất của <span class='math'>f(x) = x³ − 3x</span> trên đoạn [−2; 2].", opts:["2","−8","0","−2"], ans:3, exp:"f'(x) = 3x² − 3 = 0 ⇒ x = ±1 (cả hai đều thuộc [−2; 2]). Tính f(−2) = −2, f(−1) = 2, f(1) = −2, f(2) = 2. Vậy GTNN là −2."},
  {topic:"dt", q:"Đồ thị hàm số <span class='math'>y = x³ − 3x</span> có bao nhiêu điểm uốn?", opts:["0","1","2","3"], ans:1, exp:"y'' = 6x, y'' = 0 ⇔ x = 0 và y'' đổi dấu qua x = 0. Đồ thị có đúng một điểm uốn, tại gốc O(0; 0). Đồ thị đối xứng qua gốc tọa độ."},
  {topic:"gd", q:"Số giao điểm của đồ thị <span class='math'>y = x³ − 3x</span> và đường thẳng <span class='math'>y = x</span> là?", opts:["1","2","3","4"], ans:2, exp:"Phương trình hoành độ giao điểm: x³ − 3x = x ⇔ x³ − 4x = 0 ⇔ x(x² − 4) = 0 ⇔ x = 0, x = ±2. Có 3 nghiệm phân biệt nên có 3 giao điểm."},
  {topic:"vt", q:"Cho A(1; 2) và B(3; −1). Tọa độ vectơ AB là?", opts:["(−2; 3)","(4; 1)","(2; 3)","(2; −3)"], ans:3, exp:"AB = (x_B − x_A; y_B − y_A) = (3 − 1; −1 − 2) = (2; −3)."},
  {topic:"vt", q:"Cho u = (1; 2) và v = (3; −1). Tích vô hướng u·v bằng?", opts:["5","1","−1","3"], ans:1, exp:"u·v = 1·3 + 2·(−1) = 3 − 2 = 1."},
  {topic:"dh", q:"Cho <span class='math'>f(x) = x⁴ − 2x²</span>. Tính <span class='math'>f'(x)</span>.", opts:["4x³ − 2x","x⁴ − 4x","4x³ − 4x","4x² − 4"], ans:2, exp:"(x⁴)' = 4x³ và (−2x²)' = −4x. Vậy f'(x) = 4x³ − 4x."},
  {topic:"dh", q:"Cho <span class='math'>f(x) = √(x² + 1)</span>. Tính <span class='math'>f'(x)</span>.", opts:["x/(2√(x² + 1))","2x/√(x² + 1)","x/√(x² + 1)","1/√(x² + 1)"], ans:2, exp:"Dùng (√u)' = u'/(2√u) với u = x² + 1, u' = 2x: f'(x) = 2x/(2√(x² + 1)) = x/√(x² + 1)."},
  {topic:"dd", q:"Cho <span class='math'>f(x) = −x³ + 3x + 2</span>. Hàm số đồng biến trên khoảng nào?", opts:["(−∞; −1)","(−1; 1)","(1; +∞)","(−∞; 1)"], ans:1, exp:"f'(x) = −3x² + 3 = −3(x² − 1). f'(x) > 0 ⇔ −1 < x < 1, nên hàm đồng biến trên (−1; 1)."},
  {topic:"dd", q:"Cho <span class='math'>f(x) = x/(x + 1)</span>. Khẳng định nào đúng?", opts:["Đồng biến trên ℝ","Nghịch biến trên ℝ","Nghịch biến trên (−∞; −1) và (−1; +∞)","Đồng biến trên (−∞; −1) và (−1; +∞)"], ans:3, exp:"TXĐ: x ≠ −1. f'(x) = [1·(x+1) − x·1]/(x+1)² = 1/(x+1)² > 0 với mọi x ≠ −1, nên hàm đồng biến trên mỗi khoảng xác định."},
  {topic:"ct", q:"Hàm số <span class='math'>f(x) = x⁴ − 4x² + 1</span> có bao nhiêu điểm cực trị?", opts:["1","2","3","4"], ans:2, exp:"f'(x) = 4x³ − 8x = 4x(x² − 2). f'(x) = 0 ⇔ x = 0 hoặc x = ±√2. f' đổi dấu tại cả ba điểm, nên hàm số có 3 cực trị."},
  {topic:"ct", q:"Giá trị cực đại của <span class='math'>f(x) = x³ − 6x² + 9x + 1</span> là?", opts:["1","5","−3","9"], ans:1, exp:"f'(x) = 3x² − 12x + 9 = 3(x − 1)(x − 3). f' đổi dấu từ + sang − tại x = 1 nên đây là điểm cực đại. Giá trị cực đại: f(1) = 1 − 6 + 9 + 1 = 5."},
  {topic:"gt", q:"Tìm giá trị lớn nhất của <span class='math'>f(x) = x² − 4x + 3</span> trên đoạn [0; 3].", opts:["0","−1","3","2"], ans:2, exp:"f'(x) = 2x − 4 = 0 ⇔ x = 2. Tính f(0) = 3, f(2) = −1, f(3) = 0. Vậy GTLN là 3, đạt tại x = 0."},
  {topic:"gt", q:"Tìm giá trị nhỏ nhất của <span class='math'>f(x) = x + 4/x</span> trên khoảng (0; +∞).", opts:["2","4","5","0"], ans:1, exp:"f'(x) = 1 − 4/x² = 0 ⇔ x = 2 (vì x > 0). f' < 0 trước x = 2 và f' > 0 sau đó, nên f(2) = 4 là giá trị nhỏ nhất."},
  {topic:"dt", q:"Đỉnh của parabol <span class='math'>y = x² − 4x + 3</span> là điểm nào?", opts:["(2; −1)","(−2; 1)","(4; 3)","(1; 0)"], ans:0, exp:"Hoành độ đỉnh x = −b/(2a) = 4/2 = 2. Tung độ y = 4 − 8 + 3 = −1. Đỉnh là (2; −1)."},
  {topic:"dt", q:"Tiệm cận ngang của đồ thị hàm số <span class='math'>y = (x + 1)/(x − 2)</span> là?", opts:["x = 2","y = 1","y = −1","x = −1"], ans:1, exp:"lim (x→±∞) (x+1)/(x−2) = 1, nên đường thẳng y = 1 là tiệm cận ngang. Tiệm cận đứng là x = 2."},
  {topic:"gd", q:"Số giao điểm của parabol <span class='math'>y = x² − 3</span> với trục hoành là?", opts:["0","1","2","3"], ans:2, exp:"Hoành độ giao điểm là nghiệm của x² − 3 = 0 ⇔ x = ±√3. Có 2 giao điểm."},
  {topic:"gd", q:"Tổng hoành độ các giao điểm của đường thẳng <span class='math'>y = 2x + 1</span> và parabol <span class='math'>y = x²</span> bằng?", opts:["−2","1","2","−1"], ans:2, exp:"Hoành độ giao điểm thỏa x² = 2x + 1 ⇔ x² − 2x − 1 = 0, có Δ' > 0 nên 2 nghiệm phân biệt. Theo Vi-ét, tổng hai nghiệm bằng 2."},
  {topic:"vt", q:"Cho a = (2; −1) và b = (−3; 4). Tọa độ vectơ a + b là?", opts:["(−1; 3)","(5; −5)","(−5; 5)","(1; −3)"], ans:0, exp:"a + b = (2 + (−3); −1 + 4) = (−1; 3)."},
  {topic:"vt", q:"Độ dài vectơ u = (3; 4) bằng?", opts:["7","5","√7","12"], ans:1, exp:"|u| = √(3² + 4²) = √25 = 5."},
  {topic:"vt", q:"Tọa độ trung điểm M của đoạn AB với A(1; 3) và B(5; −1) là?", opts:["(6; 2)","(2; 1)","(3; 1)","(4; 2)"], ans:2, exp:"M = ((1 + 5)/2; (3 + (−1))/2) = (3; 1)."},
  {topic:"dh", q:"Cho <span class='math'>f(x) = (x² + 1)³</span>. Tính <span class='math'>f'(x)</span>.", opts:["3(x² + 1)²","6x(x² + 1)²","2x(x² + 1)²","6x(x² + 1)"], ans:1, exp:"Áp dụng (uⁿ)' = n·uⁿ⁻¹·u' với u = x² + 1, u' = 2x: f'(x) = 3(x² + 1)²·2x = 6x(x² + 1)²."},

function figHTML(id){
  const s = FIGS[id];
  if(!s) return "";
  const W=360,H=260,P=34;
  const [x0,x1]=s.x, [y0,y1]=s.y;
  const X=x=>P+(x-x0)/(x1-x0)*(W-2*P);
  const Y=y=>H-P-(y-y0)/(y1-y0)*(H-2*P);
  const fm=v=>String(+v.toFixed(2)).replace(".",",").replace("-","−");
  const ax=(x0<=0&&0<=x1)?X(0):P, ay=(y0<=0&&0<=y1)?Y(0):H-P;
  let g=`<line class="ax" x1="${P-10}" y1="${ay}" x2="${W-P+10}" y2="${ay}"/><line class="ax" x1="${ax}" y1="${H-P+10}" x2="${ax}" y2="${P-10}"/>`;
  g+=`<text class="tk" x="${W-P+4}" y="${ay+17}">x</text><text class="tk" x="${ax+8}" y="${P-8}">y</text>`;
  (s.fns||[]).forEach((f,k)=>{
    let d="", pen=false;
    for(let i=0;i<=200;i++){
      const x=x0+(x1-x0)*i/200, y=f(x);
      if(!isFinite(y)||y<y0||y>y1){pen=false;continue;}
      d+=(pen?"L":"M")+X(x).toFixed(1)+" "+Y(y).toFixed(1)+" ";
      pen=true;
    }
    g+=`<path class="cv${k%2?" c2":""}" d="${d}"/>`;
  });
  const pts=s.pts||[], xs=[], ys=[];
  pts.forEach(([x,y])=>{
    g+=`<line class="ds" x1="${X(x)}" y1="${Y(y)}" x2="${X(x)}" y2="${ay}"/><line class="ds" x1="${X(x)}" y1="${Y(y)}" x2="${ax}" y2="${Y(y)}"/>`;
    xs.push(x); ys.push(y);
  });
  if(!pts.length){
    const sx=Math.max(1,Math.ceil((x1-x0)/8)), sy=Math.max(1,Math.ceil((y1-y0)/6));
    for(let x=Math.ceil(x0);x<=x1;x++) if(x%sx===0) xs.push(x);
    for(let y=Math.ceil(y0);y<=y1;y++) if(y%sy===0) ys.push(y);
  }
  const put=(vals,isX)=>{const used=[];vals.filter(v=>v!==0).forEach(v=>{
    const p=isX?X(v):Y(v);
    if(used.some(u=>Math.abs(u-p)<17)) return; used.push(p);
    g+=isX?`<text class="tk" x="${p}" y="${Math.min(ay+17,H-4)}" text-anchor="middle">${fm(v)}</text>`
          :`<text class="tk" x="${ax-6}" y="${p+4}" text-anchor="end">${fm(v)}</text>`;
  });};
  put(xs,true); put(ys,false);
  if(x0<=0&&0<=x1&&y0<=0&&0<=y1) g+=`<text class="tk" x="${ax-6}" y="${ay+17}" text-anchor="end">O</text>`;
  (s.segs||[]).forEach(([a,b,c,d])=>g+=`<line class="ds" x1="${X(a)}" y1="${Y(b)}" x2="${X(c)}" y2="${Y(d)}" style="stroke:var(--text);stroke-dasharray:none;stroke-width:2.5"/>`);
  (s.vecs||[]).forEach(([a,b,c,d])=>g+=`<line x1="${X(a)}" y1="${Y(b)}" x2="${X(c)}" y2="${Y(d)}" stroke="#e8590c" stroke-width="3" marker-end="url(#arr)"/>`);
  pts.forEach(([x,y,l])=>{ if(l&&l!=="O"){ const ct=l==="CT", ex=(l==="CĐ"||ct), mid=ex?"middle":"start", tx=ex?X(x):X(x)+7, ty=ct?Y(y)+20:Y(y)-9; g+=`<circle cx="${X(x)}" cy="${Y(y)}" r="4.5" fill="#e03131"/><text class="pl" x="${tx}" y="${Math.min(Math.max(ty,14),H-4)}" text-anchor="${mid}"${ex?` style="fill:${ct?"#4dabf7":"#ff6b6b"}"`:""}>${l}</text>`; } });
  return `<div class="figwrap"><svg viewBox="0 0 ${W} ${H}" class="fig" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#e8590c"/></marker></defs>${g}</svg></div>`;
}

function reportHTML(){
  const items = list.map((q,i)=>({q, ok: results[i]===true}));
  const rows = TOPICS.filter(t=>t.key!=="all").map(t=>{
    const its = items.filter(x=>x.q.topic===t.key);

    const ok = its.filter(x=>x.ok).length;
    const pct = Math.round(ok/its.length*100);
    return `<div class="trow"><span>${t.name}</span><div class="bar"><i style="width:${pct}%"></i></div><span>${ok}/${its.length}</span></div>`;
  }).join("");
  const wrong = items.filter(x=>!x.ok).map(x=>`<div class="wr">${x.q.q}<br><b>Đáp án đúng:</b> ${String.fromCharCode(65+x.q.ans)}. ${x.q.opts[x.q.ans]}<br>${x.q.exp}</div>`).join("");

}

function getName(){ const el=document.getElementById("pname"); return el ? el.value.trim() : ""; }

function showPage(two){
  ["title","gate","startBtn"].forEach(id=>document.getElementById(id).hidden=two);
  ["subLine","tabs","lenRow","app","backBtn"].forEach(id=>document.getElementById(id).hidden=!two);
}
document.getElementById("startBtn").onclick=()=>{
  const inp=document.getElementById("pname");
  if(!inp.value.trim()){ inp.focus(); inp.placeholder="Nhập tên trước khi làm bài"; return; }
  showPage(true);
};
document.getElementById("backBtn").onclick=()=>showPage(false);
document.getElementById("pname").addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("startBtn").click(); });
showPage(false);

let current = "all";
let list = [];
let idx = 0;
let score = 0;
let answered = false;

function buildTabs(){
  const t = document.getElementById("tabs");
  t.innerHTML = TOPICS.map(x =>
    `<button class="tab ${x.key===current?'active':''}" data-k="${x.key}">${x.name}</button>`).join("");
  t.querySelectorAll(".tab").forEach(b => b.onclick = () => start(b.dataset.k));
}

function start(key){
  current = key;
  list = QUESTIONS.filter(q => key==="all" || q.topic===key);
  const nL=+document.getElementById("lenSel").value;
  if(nL&&nL<list.length) list=list.map(q=>[Math.random(),q]).sort((a,b)=>a[0]-b[0]).slice(0,nL).map(x=>x[1]);
  idx = 0; score = 0; results = [];
  buildTabs();
  render();
}

function render(){
  const pf=document.getElementById("pfill");
  if(pf) pf.style.width=(list.length?Math.min(idx,list.length)/list.length*100:0)+"%";
  const app = document.getElementById("app");
  if(list.length === 0){ app.innerHTML = "<p>Chưa có câu hỏi.</p>"; return; }
  if(idx >= list.length){
    app.innerHTML = `<div class="score"><div>Hoàn thành${getName()?" · "+getName():""}</div>
      <div class="big">${(score/list.length*10).toFixed(1)} / 10</div><div class="sub">Đúng ${score}/${list.length} câu · ${Math.round(score/list.length*100)}%</div>${reportHTML()}
      <div class="row"><button class="btn" id="again">Làm lại</button></div></div>`;
    document.getElementById("again").onclick = () => start(current);
    return;
  }
  answered = false;
  const q = list[idx];
  app.innerHTML = `
    <div class="meta"><span>Câu ${idx+1}/${list.length}</span><span>Điểm: ${score}</span></div>
    <p class="q">${q.q}</p>${SHOW_FIG.has(q.id)?figHTML(q.id):""}${bbtHTML(q.id)}
    <div id="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join("")}</div>
    <div class="expl" id="expl">${q.exp}</div>
    <div class="row"><button class="btn ghost" id="skip">Bỏ qua</button><button class="btn" id="next" disabled>Câu tiếp</button></div>`;
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => choose(+b.dataset.i));
  document.getElementById("skip").onclick = () => { idx++; render(); };
  document.getElementById("next").onclick = () => { idx++; render(); };
}

function choose(i){
  if(answered) return;
  answered = true;
  const q = list[idx];
  const btns = document.querySelectorAll(".opt");
  btns.forEach(b => b.disabled = true);
  btns[q.ans].classList.add("correct");
  results[idx] = (i === q.ans);
  if(i === q.ans){ score++; } else { btns[i].classList.add("wrong"); }
  document.getElementById("expl").classList.add("show");
  document.getElementById("next").disabled = false;
  document.querySelector(".meta span:last-child").textContent = "Điểm: " + score;
}

document.getElementById("lenSel").onchange=()=>start(current);
start("all");

</script>
